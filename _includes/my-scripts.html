<!--
Example code for the CloudFlare mail protection script.
CloudFlare will inject this on every page, but due to Hydejack's push state approach to page loading,
it will only run on the initial page.
The snippet below will run the code on every `hy-push-state-load` event instead.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-load', function (e) {
    function e(e){
      (console.error?console.error:console.log).call(console,e)
    }

    function t(e){
      return l.innerHTML='<a href="'+e.replace(/"/g,"&quot;")+'"></a>',l.childNodes[0].getAttribute("href")
    }

    function r(e,t){
      var r=e.substr(t,2);return parseInt(r,16)
    }

    function n(e,n){
      for(var o="",c=r(e,n),a=n+2;a<e.length;a+=2){
        var l=r(e,a)^c;
        o+=String.fromCharCode(l)
      }
      return t(o)
    }

    var o="/cdn-cgi/l/email-protection#",
        c=".__cf_email__",
        a="data-cfemail",
        l=document.createElement("div");

    !function(){
      for(var t=document.getElementsByTagName("a"),r=0;r<t.length;r++)
        try{
          var c=t[r],a=c.href.indexOf(o);
          a>-1&&(c.href="mailto:"+n(c.href,a+o.length))
        }catch(t){
          e(t)
        }
    }(),
    function(){
      for(var t=document.querySelectorAll(c),r=0;r<t.length;r++)
        try{
          var o=t[r],l=n(o.getAttribute(a),0),i=document.createTextNode(l);
          o.parentNode.replaceChild(i,o)
        }catch(t){
          e(t)
        }
    }()
  });
</script>
{% endcomment %}

<!--
Hydejack swaps page content without a full reload, and videos inserted that way do not start on their own.
Restart muted autoplay videos (e.g. the home page loop) after every in-site navigation.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-load', function () {
    document.querySelectorAll('main video[autoplay]').forEach(function (v) {
      v.load();
      v.play().catch(function () {});
    });
  });
</script>

<!--
The free Hydejack theme does not ship a search index. This original implementation searches
the published post metadata embedded in /search/ and works after Hydejack push-state navigation.
-->
<script>
  (function () {
    var categoryNames = {
      blog: 'ML & Engineering',
      tips: 'AI & Developer Tips',
      ds: 'Data Analysis & Statistics'
    };

    function initSiteSearch() {
      var form = document.getElementById('site-search-form');
      var dataElement = document.getElementById('site-search-data');
      var input = document.getElementById('site-search-input');
      var results = document.getElementById('site-search-results');
      var status = document.getElementById('site-search-status');

      if (!form || !dataElement || !input || !results || !status || form.dataset.searchReady) return;

      var posts;
      try {
        posts = JSON.parse(dataElement.textContent);
      } catch (error) {
        status.textContent = 'Search is temporarily unavailable.';
        return;
      }

      form.dataset.searchReady = 'true';

      function render(query) {
        var terms = query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
        var matches = posts.filter(function (post) {
          var haystack = [post.title, post.description, post.category].join(' ').toLocaleLowerCase();
          return terms.every(function (term) { return haystack.indexOf(term) !== -1; });
        });

        if (!terms.length) matches = posts.slice(0, 8);
        matches = matches.slice(0, 30);
        results.textContent = '';

        matches.forEach(function (post) {
          var item = document.createElement('li');
          var link = document.createElement('a');
          var meta = document.createElement('div');
          var description = document.createElement('p');

          item.className = 'search-result';
          link.className = 'search-result-title';
          link.href = post.url;
          link.textContent = post.title;
          meta.className = 'search-result-meta';
          meta.textContent = post.date + ' · ' + (categoryNames[post.category] || post.category || 'Post');
          description.className = 'search-result-description';
          description.textContent = post.description;

          item.appendChild(link);
          item.appendChild(meta);
          item.appendChild(description);
          results.appendChild(item);
        });

        if (!terms.length) {
          status.textContent = 'Showing the 8 newest published posts.';
        } else if (matches.length === 1) {
          status.textContent = '1 result for “' + query.trim() + '”.';
        } else {
          status.textContent = matches.length + ' results for “' + query.trim() + '”.';
        }
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        render(input.value);
      });
      form.addEventListener('reset', function () {
        window.setTimeout(function () { render(''); input.focus(); }, 0);
      });
      input.addEventListener('input', function () { render(input.value); });

      render(input.value);
    }

    initSiteSearch();
    document.getElementById('_pushState').addEventListener('hy-push-state-load', initSiteSearch);
  }());
</script>
